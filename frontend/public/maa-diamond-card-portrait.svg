    <g transform="scale(1.2)">
      <path fill="#ffffff" d="M0 0h27v27H0z"/><path stroke="#0f172a" d="M1 1.5h7m2 0h1m1 0h3m2 0h1m1 0h7M1 2.5h1m5 0h1m1 0h1m2 0h1m1 0h1m4 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m1 0h1m2 0h2m1 0h1m3 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m1 0h2m1 0h5m2 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m3 0h1m1 0h1m1 0h1m3 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m3 0h1m1 0h1m5 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M9 8.5h1m7 0h1M1 9.5h1m5 0h1m1 0h2m1 0h1m1 0h1m1 0h4m2 0h3M1 10.5h1m2 0h1m1 0h1m1 0h1m1 0h1m1 0h2m2 0h1m3 0h5M1 11.5h3m1 0h8m3 0h2m1 0h4m1 0h2M1 12.5h2m1 0h1m1 0h1m3 0h2m4 0h1m1 0h1m1 0h3m2 0h1M3 13.5h5m2 0h4m1 0h2m2 0h2m4 0h1M1 14.5h2m1 0h2m2 0h3m2 0h1m1 0h3m2 0h1m3 0h1M1 15.5h1m5 0h2m1 0h1m2 0h1m2 0h2m1 0h1m2 0h1m1 0h2M1 16.5h1m1 0h1m1 0h2m1 0h4m3 0h2m1 0h3m2 0h1m1 0h1M1 17.5h1m2 0h1m1 0h3m1 0h2m1 0h2m2 0h5m1 0h1M9 18.5h2m1 0h1m1 0h1m2 0h1m3 0h1m1 0h1M1 19.5h7m3 0h3m3 0h1m1 0h1m1 0h2m2 0h1M1 20.5h1m5 0h1m2 0h1m1 0h2m1 0h3m3 0h1M1 21.5h1m1 0h3m1 0h1m6 0h10M1 22.5h1m1 0h3m1 0h1m3 0h2m2 0h1m1 0h3m2 0h1m1 0h2M1 23.5h1m1 0h3m1 0h1m3 0h1m2 0h1m1 0h2m2 0h1m2 0h1m1 0h1M1 24.5h1m5 0h1m2 0h1m2 0h1m1 0h1m1 0h2m1 0h2m3 0h1M1 25.5h7m1 0h1m2 0h2m3 0h3m2 0h1m2 0h1"/>
    </g>
  </g>

  <!-- Bottom Details & Website Footer -->
  <text x="319" y="865" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="3">SCAN TO VIEW DIGITAL VCARD &amp; INVENTORY</text>
  <text x="319" y="905" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">202, Akshar Diamond Market, Mangadh Chowk, Mini Bazaar, Varachha, Surat - 395006</text>
  <text x="319" y="935" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle" letter-spacing="1.5">maa-diamond.vercel.app</text>

